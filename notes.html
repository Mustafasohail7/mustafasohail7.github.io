<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Notes — Writeups and learning by Mustafa Sohail.">
  <title>Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] } } },
    };
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="notes" class="font-sans antialiased min-h-screen">

  <div id="navbar"></div>
  <div id="modals"></div>

  <main class="max-w-5xl mx-auto px-6 pt-32 pb-24">
    <header class="mb-12 fade-in">
      <h1 class="text-4xl font-medium text-[#eceae6] tracking-tight mb-3">Notes</h1>
      <p class="text-lg text-[#9b9aa3]">Thinking space for writeups and learning.</p>
    </header>

    <div id="note-filters" class="flex flex-wrap gap-2 mb-12 fade-in"></div>

    <div id="notes-grid" class="grid gap-5 mb-16"></div>

    <div id="notes-feedback" class="card feedback-card fade-in"></div>
  </main>

  <div id="footer"></div>

  <script src="js/content.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
